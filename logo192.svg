<svg width="192" height="192" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer base -->
  <rect width="100" height="100" rx="20" fill="#0f172a" />
  
  <!-- Stylized 'N' with soundbars -->
  <!-- Left Leg -->
  <rect x="25" y="30" width="8" height="40" rx="4" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Diagonal (Connecting) -->
  <path d="M33 30 L65 70" stroke="url(#grad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Right Leg -->
  <rect x="65" y="30" width="8" height="40" rx="4" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Radio Waves / Sun Rays (Top Left) -->
  <circle cx="20" cy="20" r="4" fill="#f59e0b" />
  <path d="M28 20 A 8 8 0 0 0 20 28" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M36 20 A 16 16 0 0 0 20 36" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- Live Glow Dot (Top Right) -->
  <circle cx="80" cy="20" r="3" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
